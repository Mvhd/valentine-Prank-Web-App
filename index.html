<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Confetti library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    text-align:center;
    background:#ffe6eb;
    overflow:hidden;
}

#loveLetter{
line-height:1.6;
text-align:left;
}

#slideshow img{
transition:0.6s;
}


/* containers */
.container{
    padding:20px;
    margin-top:80px;
}

.hidden{ display:none; }

/* buttons */
button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.yesBtn{
    background:#ff4d6d;
    color:white;
}

.noBtn{
    background:#333;
    color:white;
    position:absolute;
}

/* floating hearts */
.heart{
    position:fixed;
    bottom:-10px;
    font-size:24px;
    animation:floatUp 5s linear infinite;
}

@keyframes floatUp{
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

/* countdown */
#countdown{
    font-size:20px;
    margin-top:20px;
}

/* envelope */
.envelope{
    font-size:120px;
}

/* mobile */
@media(max-width:600px){
    h1{font-size:22px;}
    button{font-size:16px;}
}

</style>
</head>

<body>

<!-- background music -->
<audio id="music" autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8f5b0b1d5.mp3" type="audio/mp3">
</audio>

<!-- NAME INPUT -->
<div class="container" id="namePage">
<h1>Enter your name ❤️</h1>
<input id="userName" placeholder="Your name" style="padding:10px;border-radius:8px;border:none;">
<br><br>
<button id="startBtn" class="yesBtn">Start</button>
</div>

<!-- QUESTION 1 -->
<div class="container hidden" id="question1">
<h1 id="questionText"></h1>
<div id="countdown"></div>
<br>
<button id="yes1" class="yesBtn">Yes ❤️</button>
<button id="no1" class="noBtn">No</button>
</div>

<!-- CELEBRATION -->
<div class="container hidden" id="celebration">
<h1 id="celebrateMsg"></h1>
<h2>🎉💖🥰</h2>
<button id="giftBtn" class="yesBtn">See Your Gift 🎁</button>
</div>

<!-- SECOND QUESTION -->
<div class="container hidden" id="question2">
<h1>say YES to kissing me on Valentine's Day 😘</h1>
<button id="kissYes" class="yesBtn">Yes 😍</button>
<button id="kissNo" class="noBtn">No</button>
</div>

<!-- FINAL GIFT -->
<div class="container hidden" id="gift">
<div class="envelope">💌</div>
<h1>Click to open your surprise</h1>
<button id="openGift" class="yesBtn">Open</button>
</div>

<!-- REAL GIFT PAGE -->
<div class="container hidden" id="realGift">

<h1>❤️ Happy Valentine's Day ❤️</h1>

<!-- Envelope opens -->
<div id="letterBox" class="hidden">
    <h2>💌 A Letter For You</h2>
    <div id="loveLetter"
    style="max-width:500px;margin:auto;padding:20px;background:white;border-radius:12px;">
    </div>
</div>

<br>

<!-- Photo slideshow -->
<h2>Our Memories 📸</h2>

<div id="slideshow"
style="max-width:400px;margin:auto;position:relative">

<img id="slideImg"
src="asset/unsplash.jpeg"
style="width:100%;border-radius:12px">
<img id="slideImg"
src="asset/unsplash1.jpeg"
style="width:100%;border-radius:12px">
<img id="slideImg"
src="asset/unsplash2.jpeg"
style="width:100%;border-radius:12px">

</div>

<br>

<button id="shareBtn" class="yesBtn">Share on WhatsApp</button>

</div>

<script>

/* ---------- floating hearts ---------- */
function createHeart(){
    let heart=$("<div>❤️</div>").addClass("heart");
    heart.css({
        left:Math.random()*100+"vw",
        animationDuration:(Math.random()*3+3)+"s"
    });
    $("body").append(heart);
    setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,300);

/* ---------- countdown to feb 14 ---------- */
function updateCountdown(){
    let target=new Date(new Date().getFullYear(),1,14);
    let now=new Date();
    let diff=target-now;

    if(diff<0){
        $("#countdown").text("It's Valentine's Day ❤️");
        return;
    }

    let d=Math.floor(diff/86400000);
    let h=Math.floor(diff%86400000/3600000);
    let m=Math.floor(diff%3600000/60000);

    $("#countdown").text(`Valentine's Day in ${d}d ${h}h ${m}m`);
}
setInterval(updateCountdown,1000);

/* ---------- move NO button ---------- */
function moveNo(btn){
    let x=Math.random()*(window.innerWidth-100);
    let y=Math.random()*(window.innerHeight-60);
    btn.css({left:x+"px",top:y+"px"});
}

/* make NO harder + YES bigger */
function makeNoImpossible(noBtn, yesBtn){
    noBtn.on("mouseover touchstart",function(){
        moveNo($(this));
        let size=parseFloat(yesBtn.css("font-size"));
        yesBtn.css("font-size", size+2+"px");
        let pad=parseFloat(yesBtn.css("padding"));
        yesBtn.css("padding",(pad+2)+"px");
        noBtn.css("transform","scale(0.9)");
    });
}

/* ---------- start app ---------- */
$("#startBtn").click(()=>{
    let name=$("#userName").val()||"Habibti";
    $("#questionText").text(name+", will you be my Valentine? ❤️");
    $("#celebrateMsg").text("I knew you would make the right choice, "+name+" 😌!");

    $("#namePage").fadeOut(()=>$("#question1").fadeIn());
});

/* ---------- question1 ---------- */
makeNoImpossible($("#no1"),$("#yes1"));

$("#yes1").click(()=>{
    confetti({particleCount:200,spread:100});
    $("#question1").fadeOut(()=>$("#celebration").fadeIn());
});

/* ---------- see gift ---------- */
$("#giftBtn").click(()=>{
    $("#celebration").fadeOut(()=>$("#question2").fadeIn());
});

/* ---------- second question ---------- */
makeNoImpossible($("#kissNo"),$("#kissYes"));

$("#kissYes").click(()=>{
    confetti({particleCount:300,spread:120});
    $("#question2").fadeOut(()=>$("#gift").fadeIn());
});

/* ---------- open gift ---------- */
$("#openGift").click(()=>{
    $("#gift").fadeOut(()=>$("#realGift").fadeIn());
});

/* ---------- whatsapp share ---------- */
$("#shareBtn").click(()=>{
    let text="I just got a Valentine surprise ❤️";
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
});

/* enable music autoplay after first touch (mobile browsers need interaction) */
document.body.addEventListener("click",()=>{
    document.getElementById("music").play().catch(()=>{});
},{once:true});

</script>

</body>
</html>
